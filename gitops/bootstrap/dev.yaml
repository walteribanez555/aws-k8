# Root Application (app-of-apps) for the dev environment.
# Apply once after ArgoCD is installed:
#   kubectl apply -f gitops/bootstrap/dev.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/walteribanez555/aws-k8
    targetRevision: HEAD
    path: gitops/apps/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
